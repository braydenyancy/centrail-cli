name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  # Every OS a user runs the CLI and its Claude Code plugin on, at the
  # oldest Node it supports and the current LTS.
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      # The plugin ships the committed bundle, not this build: a source
      # change without its rebuilt bundle would ship the old CLI.
      - name: Committed plugin bundle is the current build
        run: git diff --exit-code -- plugins/
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:server-contract

  # Claude Code's own validator, over the marketplace and the plugin.
  plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm i -g @anthropic-ai/claude-code
      - run: claude plugin validate . --strict
      - run: claude plugin validate plugins/centrail --strict

  server-contract:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - id: scanner-surfaces
        run: node scripts/export-scanner-surfaces.mjs required
      # Gated scanners skip unsupported logs without advancing watermarks.
      # Main requires existing surfaces; publication requires every scanner.
      # PRs prove both policies offline in the build-test matrix above.
      - name: Prove deployed server accepts unconditional CLI surfaces
        run: node scripts/check-server-contract.mjs
        env:
          CENTRAIL_EXPECTED_SURFACES: ${{ steps.scanner-surfaces.outputs.surfaces }}
