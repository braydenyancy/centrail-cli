name: publish
on:
  push:
    tags: ["v*"]
jobs:
  npm-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release branch below; nothing else is written
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the push below must see release's tip to fast-forward it
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - id: scanner-surfaces
        run: node scripts/export-scanner-surfaces.mjs
      - name: Prove deployed server accepts every CLI surface
        run: node scripts/check-server-contract.mjs
        env:
          CENTRAIL_EXPECTED_SURFACES: ${{ steps.scanner-surfaces.outputs.surfaces }}
      - run: npm publish --workspaces --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # The Claude Code plugin's marketplace is pinned to `release` (README §
      # The Claude Code plugin): tags never move, so this branch does, and
      # only once npm holds the same version. Claude Code's auto-update sees
      # the bumped plugin.json version. Fast-forward only, created on first
      # use: a tag cut behind it fails here instead of rewinding everyone.
      - name: Fast-forward the release branch to this tag
        run: git push origin "$GITHUB_SHA:refs/heads/release"
