name: Offline parser comparisons
on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'packages/parsers/**'
      - 'tools/tokscale-compare/**'
      - '.github/workflows/comparisons.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - name: Provision pinned comparison tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap python3-pip
          # The dedicated ephemeral job needs unprivileged namespaces for bwrap.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          /usr/bin/python3 tools/tokscale-compare/provision.py --directory "$RUNNER_TEMP/comparison-tools"
      - name: Gate self-tests
        run: npm run test:comparison-gate
      - name: Run offline comparisons
        run: npm run test:comparisons -- --out "$RUNNER_TEMP/comparison-report"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parser-comparison-evidence
          path: ${{ runner.temp }}/comparison-report/
